# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-psa-system
---
# ServiceAccount for the scanner
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-psa-sa
  namespace: k8s-psa-system
---
# ClusterRole: read pods and nodes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-psa-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-psa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-psa-role
subjects:
- kind: ServiceAccount
  name: k8s-psa-sa
  namespace: k8s-psa-system
---
# ═══════════════════════════════════════════════════════════════
#  SCANNER — DaemonSet (one per node)
#  Writes findings to /var/log/k8s-psa/ on the host
# ═══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-psa
  namespace: k8s-psa-system
spec:
  selector:
    matchLabels:
      app: k8s-psa
  template:
    metadata:
      labels:
        app: k8s-psa
    spec:
      serviceAccountName: k8s-psa-sa
      containers:
      - name: k8s-psa
        image: k8s-psa:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SCAN_INTERVAL
          value: "60"
        - name: ENABLE_DRIFT
          value: "true"
        - name: RUNTIME_BACKEND
          value: "auto"
        - name: DATA_DIR
          value: "/data"
        volumeMounts:
        - name: shared-data
          mountPath: /data
        - name: docker-socket
          mountPath: /var/run/docker.sock
          readOnly: true
        - name: containerd-socket
          mountPath: /var/run/containerd/containerd.sock
          readOnly: true
        - name: policy-config
          mountPath: /app/policies
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: shared-data
        hostPath:
          path: /var/log/k8s-psa
          type: DirectoryOrCreate
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: ""
      - name: containerd-socket
        hostPath:
          path: /var/run/containerd/containerd.sock
          type: ""
      - name: policy-config
        configMap:
          name: k8s-psa-policies
---
# ═══════════════════════════════════════════════════════════════
#  DASHBOARD — Deployment (reads from same hostPath)
#  Access via: kubectl port-forward svc/k8s-psa-dashboard 8080:8080 -n k8s-psa-system
# ═══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-psa-dashboard
  namespace: k8s-psa-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-psa-dashboard
  template:
    metadata:
      labels:
        app: k8s-psa-dashboard
    spec:
      containers:
      - name: dashboard
        image: k8s-psa-dashboard:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_DIR
          value: "/data"
        - name: DASHBOARD_PORT
          value: "8080"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: shared-data
          mountPath: /data
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: shared-data
        hostPath:
          path: /var/log/k8s-psa
          type: DirectoryOrCreate
---
# Service for the dashboard
apiVersion: v1
kind: Service
metadata:
  name: k8s-psa-dashboard
  namespace: k8s-psa-system
spec:
  selector:
    app: k8s-psa-dashboard
  ports:
  - port: 8080
    targetPort: 8080
