apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-psa
  namespace: k8s-psa-system
spec:
  selector:
    matchLabels:
      app: k8s-psa
  template:
    metadata:
      labels:
        app: k8s-psa
    spec:
      serviceAccountName: k8s-psa-sa
      hostNetwork: false
      hostPID: false
      hostIPC: false
      containers:
      - name: k8s-psa
        image: k8s-psa:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SCAN_INTERVAL
          value: "300"
        volumeMounts:
        - name: policy-config
          mountPath: /app/policies
        - name: log-volume
          mountPath: /var/log
        - name: runtime-socket
          mountPath: /var/run/docker.sock
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: policy-config
        configMap:
          name: k8s-psa-policies
      - name: log-volume
        hostPath:
          path: /var/log/k8s-psa
          type: DirectoryOrCreate
      - name: runtime-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket