apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: good-container
    image: nginx:latest
    securityContext:
      runAsNonRoot: true
      runAsUser: 101 # مستخدم nginx الافتراضي غالباً 101 وليس 1000
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    # إضافة نقاط تحميل للمجلدات التي تحتاج كتابة
    volumeMounts:
    - mountPath: /var/cache/nginx
      name: cache-volume
    - mountPath: /var/run
      name: run-volume
  volumes:
  - name: cache-volume
    emptyDir: {}
  - name: run-volume
    emptyDir: {}
