version: "1.0"
checks:
  - id: "privileged_container"
    description: "Container should not run in privileged mode"
    severity: "high"
    check_type: "container"
    
  - id: "root_container"
    description: "Container should not run as root user"
    severity: "high"
    check_type: "container"
    
  - id: "host_network"
    description: "Pod should not use host network namespace"
    severity: "medium"
    check_type: "pod"
    
  - id: "host_pid"
    description: "Pod should not use host PID namespace"
    severity: "medium"
    check_type: "pod"
    
  - id: "host_ipc"
    description: "Pod should not use host IPC namespace"
    severity: "medium"
    check_type: "pod"
    
  - id: "seccomp_profile"
    description: "Pod should have seccomp profile set"
    severity: "medium"
    check_type: "pod"
    
  - id: "capabilities"
    description: "Container should not have dangerous capabilities"
    severity: "medium"
    check_type: "container"
    
  - id: "read_only_root"
    description: "Container root filesystem should be read-only"
    severity: "low"
    check_type: "container"